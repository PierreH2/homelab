apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-ovh
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/baarde/cert-manager-webhook-ovh
    # Pinned to the "Release 0.3.12" commit instead of tracking main
    targetRevision: 9812ec42ef042cae7be395a13ef97d89ad1817e2
    path: deploy/cert-manager-webhook-ovh

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
