name: kubectl delete -f

on:
  workflow_dispatch: 
    inputs:
      path:
        description: 'Chemin du manifeste ou dossier à supprimer avec kubectl'
        required: true
        default: './'

permissions:
  contents: read

jobs:
  check-connection:
    # On utilise le label que tu as défini dans ton RunnerDeployment
    runs-on: homelab-self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verifier l'identité du runner
        run: |
          echo "Hostname du pod : $(hostname)"
          echo "Date du jour : $(date)"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # L'input passe par une variable d'env pour éviter l'injection de commandes dans le shell
      - name: kubectl delete -f
        env:
          MANIFEST_PATH: ${{ github.event.inputs.path }}
        run: kubectl delete -f "$MANIFEST_PATH"